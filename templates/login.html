<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أملاك عبدالقادر عفيف</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="apple-mobile-web-app-title" content="أملاك عفيف">
    <meta name="application-name" content="أملاك عفيف">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body>
    <div class="center-wrap">
        <div class="card login-card">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="عفيف">
            <h1>أملاك عبدالقادر عفيف</h1>
            <p class="muted" style="margin:0">إدارة الشقق والعقود</p>
            {% if error %}<div class="alert alert-error" style="margin-top:14px">{{ error }}</div>{% endif %}
            <form method="POST" action="{{ url_for('check_password') }}">
                <div>
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" autofocus required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">دخول</button>
            </form>
        </div>
    </div>
</body>
</html>
