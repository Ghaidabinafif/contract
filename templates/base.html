<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}أملاك عبدالقادر عفيف{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('apartments') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="عفيف">
            </a>
            <a class="logout" href="{{ url_for('logout') }}">خروج</a>
        </div>
        <nav class="tabs">
            <a href="{{ url_for('apartments') }}" class="{% if request.endpoint == 'apartments' %}on{% endif %}">الشقق</a>
            <a href="{{ url_for('contract_page') }}" class="{% if request.endpoint in ('contract_page', 'search_contract') and not contract %}on{% endif %}">عقد جديد</a>
            <a href="{{ url_for('view_database') }}" class="{% if request.endpoint == 'view_database' %}on{% endif %}">كل العقود</a>
        </nav>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
